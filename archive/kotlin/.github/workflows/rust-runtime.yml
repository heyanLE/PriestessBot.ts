name: Rust runtime
on:
  push:
    paths: ['rust/**', 'dashboard/**', '.github/workflows/rust-runtime.yml']
  pull_request:
    paths: ['rust/**', 'dashboard/**', '.github/workflows/rust-runtime.yml']
jobs:
  qualify:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98'
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake protobuf-compiler pkg-config libssl-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Pinned Engine and V8
        run: python3 rust/scripts/bootstrap.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-all-crates: true
          key: ${{ runner.os }}-engine-7c410850
      - run: rust/scripts/check.sh
      - run: rust/scripts/smoke.sh
      - run: npm --prefix dashboard ci && npm --prefix dashboard run build
      - run: python3 rust/scripts/test-legacy-import.py
      - name: Contract drift
        run: python3 rust/scripts/generate-contracts.py --check
      - name: Package tested binaries
        run: python3 rust/scripts/package.py --profile dev --skip-build --output rust/.build/release
      - uses: actions/upload-artifact@v4
        with:
          name: priestess-${{ runner.os }}-${{ runner.arch }}
          path: rust/.build/release
