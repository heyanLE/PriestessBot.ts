name: PriestessBot
on:
  push:
    paths: ['apps/**', 'packages/**', 'tests/**', 'tools/**', 'resources/**', 'dashboard/**', 'scripts/**', 'package*.json', 'tsconfig*.json', 'eslint.config.ts', 'Dockerfile*', '.dockerignore', 'compose.yml', '.github/workflows/typescript-runtime.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'tests/**', 'tools/**', 'resources/**', 'dashboard/**', 'scripts/**', 'package*.json', 'tsconfig*.json', 'eslint.config.ts', 'Dockerfile*', '.dockerignore', 'compose.yml', '.github/workflows/typescript-runtime.yml']
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci
      - run: npm --prefix dashboard ci
      - run: npm run check
      - run: npm run test:dashboard
      - run: npm run build
