[package]
name = "priestess-codex-jni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "priestess_codex_jni"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "=0.21.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
codex-astrbot-py = { path = "../../../../../codex_for_astrbot/codex-rs/astrbot-py", default-features = false }
codex-protocol = { path = "../../../../../codex_for_astrbot/codex-rs/protocol" }

# Cargo applies patches from the top-level manifest, not dependency workspaces.
# Keep these revisions aligned with the pinned codex_for_astrbot checkout.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
