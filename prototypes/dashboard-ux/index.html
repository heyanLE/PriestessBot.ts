&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;

    &quot;codex-visualization-widget-state&quot;,
  );

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {

      openExternal,
      sendFollowUpMessage,

    postToHost(&quot;height&quot;, {

        Math.max(

          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

    &quot;message&quot;,
    (event) =&gt; {

      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              data?.type === &quot;widget-state-result&quot;

    }

      });

      const trace = [`\u8BFB\u53D6\u5F53\u524D\u8349\u7A3F\uFF1A${config.personaName} / ${config.model}`, `\u4EE5${stateLabels[config.state]}\u8FDB\u884C\u6743\u9650\u68C0\u67E5`, &quot;\u9884\u8BBE\u89C4\u5219\u6A21\u62DF\uFF0C\u672A\u8C03\u7528\u771F\u5B9E\u6A21\u578B\u6216\u5DE5\u5177&quot;];
      let content;
      if (/执行|命令|脚本|下载/.test(text)) {
        if (!config.command) {
          content = &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u6267\u884C\u547D\u4EE4\u5DE5\u5177\u5C1A\u672A\u88C5\u914D\u3002\u8BF7\u5728\u201C\u80FD\u529B\u4E0E\u8D44\u6599\u201D\u4E2D\u542F\u7528\u540E\u518D\u6D4B\u8BD5\u3002&quot;;
          trace.push(&quot;\u505C\u6B62\u539F\u56E0\uFF1AAgent \u672A\u88C5\u914D\u547D\u4EE4\u5DE5\u5177&quot;);
        } else if (config.state === &quot;normal&quot;) {
          content = &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u5F53\u524D\u662F\u666E\u901A\u5E72\u5458\uFF0C\u65E0\u6CD5\u6267\u884C\u547D\u4EE4\u3002\u5DE5\u5177\u5DF2\u7ECF\u88C5\u914D\uFF0C\u9650\u5236\u6765\u81EA\u53D1\u9001\u8005\u8FD0\u884C\u6001\u3002&quot;;
          trace.push(&quot;\u6388\u6743\u62D2\u7EDD\uFF1A\u9700\u8981\u8D44\u6DF1\u5E72\u5458\u53CA\u4EE5\u4E0A&quot;);
        } else if (config.approval) {
          content = &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u6743\u9650\u68C0\u67E5\u901A\u8FC7\uFF0C\u63A5\u4E0B\u6765\u9700\u8981\u7BA1\u7406\u5458\u5BA1\u6279\u3002\u672C\u539F\u578B\u4E0D\u4F1A\u6267\u884C\u4EFB\u4F55\u771F\u5B9E\u547D\u4EE4\u3002&quot;;
          trace.push(&quot;\u7B49\u5F85\u7BA1\u7406\u5458\u5BA1\u6279 \u2192 \u5BA1\u6279\u540E\u624D\u5141\u8BB8\u6267\u884C&quot;);
        } else {
          content = &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u547D\u4EE4\u5DE5\u5177\u3001\u8FD0\u884C\u6001\u4E0E\u6C99\u7BB1\u8303\u56F4\u68C0\u67E5\u901A\u8FC7\u3002\u6B63\u5F0F\u8FD0\u884C\u65F6\u5C06\u8FDB\u5165\u9694\u79BB\u73AF\u5883\u6267\u884C\u3002&quot;;
          trace.push(&quot;\u547D\u4EE4\u6267\u884C\uFF08\u6A21\u62DF\uFF09\u2192 \u6C47\u603B\u7ED3\u679C&quot;);
        }
      } else if (/搜|查|显示器|价格/.test(text)) {
        if (!config.search) {
          content = &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u7F51\u7EDC\u641C\u7D22\u672A\u542F\u7528\u3002\u8BF7\u5728\u201C\u80FD\u529B\u4E0E\u8D44\u6599\u201D\u4E2D\u5F00\u542F\u7F51\u7EDC\u641C\u7D22\uFF0C\u518D\u53D1\u4E00\u6B21\u6D88\u606F\u3002&quot;;
          trace.push(&quot;\u505C\u6B62\u539F\u56E0\uFF1AAgent \u672A\u88C5\u914D\u7F51\u7EDC\u641C\u7D22&quot;);
        } else {
          content = file ? `\u6A21\u62DF\u7ED3\u679C\uFF1A\u5DF2\u9009\u62E9\u9644\u4EF6\u201C${file}\u201D\u3002\u6B63\u5F0F\u6D41\u7A0B\u4F1A\u8BC6\u522B\u578B\u53F7\uFF0C\u518D\u67E5\u8BE2\u53C2\u6570\u4E0E\u4EF7\u683C\uFF1B\u672C\u539F\u578B\u53EA\u663E\u793A\u6587\u4EF6\u540D\uFF0C\u4E0D\u8BFB\u53D6\u6587\u4EF6\u5185\u5BB9\u3002` : &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u7F51\u7EDC\u641C\u7D22\u53EF\u7528\u3002\u6B63\u5F0F\u6D41\u7A0B\u4F1A\u5148\u786E\u8BA4\u5177\u4F53\u578B\u53F7\uFF0C\u518D\u641C\u7D22\u53C2\u6570\u548C\u4EF7\u683C\uFF0C\u5E76\u9644\u4E0A\u6765\u6E90\u3002&quot;;
          trace.push(&quot;\u641C\u7D22\u5DE5\u5177\u53EF\u7528 \u2192 \u786E\u8BA4\u578B\u53F7 \u2192 \u68C0\u7D22\u4E0E\u6838\u5BF9 \u2192 \u9644\u4E0A\u6765\u6E90&quot;);
        }
      } else if (/记忆|记住/.test(text)) {
        content = config.memory ? &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u957F\u671F\u8BB0\u5FC6\u5DF2\u542F\u7528\u3002\u8FD9\u6761\u5185\u5BB9\u5C06\u6309\u53D1\u9001\u8005\u6216\u4F1A\u8BDD\u8303\u56F4\u5904\u7406\uFF0C\u907F\u514D\u8DE8\u7FA4\u5171\u4EAB\u3002&quot; : &quot;\u6A21\u62DF\u7ED3\u679C\uFF1A\u957F\u671F\u8BB0\u5FC6\u5DF2\u5173\u95ED\uFF0C\u8FD9\u6761\u6D88\u606F\u53EA\u8FDB\u5165\u5F53\u524D\u6D4B\u8BD5\u5BF9\u8BDD\u3002&quot;;
        trace.push(config.memory ? &quot;\u4F7F\u7528\u5F53\u524D\u4F1A\u8BDD\u8303\u56F4\u7684\u8BB0\u5FC6\u7B56\u7565&quot; : &quot;\u8DF3\u8FC7\u957F\u671F\u8BB0\u5FC6&quot;);
      } else {
        content = `\u6A21\u62DF\u7ED3\u679C\uFF1A\u6B63\u5728\u4F7F\u7528\u201C${config.personaName}\u201D\u4E0E ${config.model}\u3002
\u89D2\u8272\u8BBE\u5B9A\uFF1A${config.persona.slice(0, 90)}${config.persona.length &gt; 90 ? &quot;\u2026&quot; : &quot;&quot;}
\u793A\u4F8B\u5BF9\u8BDD\uFF1A${config.examples.length} \u7EC4\u3002\u6B63\u5F0F\u7248\u672C\u5C06\u5728\u8FD9\u91CC\u8FD4\u56DE\u6A21\u578B\u56DE\u590D\u3002`;
      }
      return { role: &quot;assistant&quot;, content, trace };
    }
    function openDialog(title, html) {
      get(&quot;#px-dialog-title&quot;).textContent = title;
      get(&quot;#px-dialog-content&quot;).innerHTML = html;
      const dialog = get(&quot;#px-dialog&quot;);
      if (dialog instanceof HTMLDialogElement &amp;&amp; !dialog.open) dialog.showModal();
      icons();
    }
    function closeDialog() {
      const dialog = get(&quot;#px-dialog&quot;);
      if (dialog instanceof HTMLDialogElement) dialog.close();
    }

    function renderBots() {
      if (!wizard) return `&lt;div class=&quot;px-section-heading&quot;&gt;&lt;h2&gt;\u5DF2\u63A5\u5165\u7684\u673A\u5668\u4EBA&lt;/h2&gt;&lt;button class=&quot;px-primary px-push-right&quot; type=&quot;button&quot; data-action=&quot;new-bot&quot;&gt;${icon(&quot;plus&quot;)}\u63A5\u5165\u673A\u5668\u4EBA&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;px-muted&quot;&gt;\u793A\u4F8B\u8FDE\u63A5\u3002\u70B9\u51FB\u63A5\u5165\uFF0C\u53EF\u4EE5\u5B8C\u6574\u8D70\u4E00\u904D\u914D\u7F6E\u6D41\u7A0B\u3002&lt;/p&gt;${robots.map((robot, index) =&gt; `&lt;div class=&quot;px-list-row&quot;&gt;&lt;div&gt;&lt;strong&gt;${escape(robot.name)}&lt;/strong&gt;&lt;small&gt;${robot.platform} \xB7 \u666E\u745E\u8D5B\u65AF \xB7 ${escape(robot.scope)}&lt;/small&gt;&lt;small&gt;${escape(robot.trigger)} \xB7 ${robot.state}&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;px-tag&quot;&gt;${robot.enabled ? &quot;\u6A21\u62DF\u5DF2\u8FDE\u63A5&quot; : &quot;\u6A21\u62DF\u5DF2\u505C\u7528&quot;}&lt;/span&gt;&lt;button type=&quot;button&quot; data-robot=&quot;${index}&quot;&gt;${robot.enabled ? &quot;\u505C\u7528&quot; : &quot;\u542F\u7528&quot;}&lt;/button&gt;&lt;button type=&quot;button&quot; data-bot-detail=&quot;${index}&quot;&gt;\u5904\u7406\u89C4\u5219&lt;/button&gt;&lt;/div&gt;`).join(&quot;&quot;)}&lt;div class=&quot;px-form-section&quot;&gt;&lt;h3&gt;\u4E00\u5957\u5168\u5C40\u6D88\u606F\u8DEF\u7531&lt;/h3&gt;&lt;p class=&quot;px-muted&quot;&gt;\u5E73\u53F0\u6D88\u606F \u2192 \u89E6\u53D1\u68C0\u67E5 \u2192 \u6743\u9650\u68C0\u67E5 \u2192 Agent \u2192 \u56DE\u590D\u6295\u9012&lt;/p&gt;&lt;button type=&quot;button&quot; data-action=&quot;route&quot; style=&quot;margin-top:15px&quot;&gt;\u6A21\u62DF\u4E00\u6761\u7FA4\u6D88\u606F&lt;/button&gt;&lt;/div&gt;`;

      else if (w.step === 2) content = `&lt;h2&gt;\u8FDE\u63A5 ${w.platform}&lt;/h2&gt;&lt;p class=&quot;px-muted&quot; style=&quot;margin:10px 0 24px&quot;&gt;\u6B64\u6B65\u9AA4\u6A21\u62DF\u8FDE\u901A\u6027\u68C0\u67E5\uFF0C\u4E0D\u4FDD\u5B58\u51ED\u636E\u3001\u4E0D\u8BBF\u95EE\u670D\u52A1\u3002&lt;/p&gt;&lt;label&gt;${w.platform === &quot;NapCat&quot; ? &quot;WebSocket \u5730\u5740&quot; : w.platform === &quot;Telegram&quot; ? &quot;Token \u5F15\u7528\u540D\u79F0\uFF08\u793A\u4F8B\uFF09&quot; : &quot;\u767B\u5F55\u8FDE\u63A5\u540D\u79F0\uFF08\u793A\u4F8B\uFF09&quot;}&lt;input name=&quot;robotAddress&quot; value=&quot;${escape(w.address)}&quot; placeholder=&quot;${w.platform === &quot;NapCat&quot; ? &quot;ws://127.0.0.1:3001&quot; : &quot;demo-connection&quot;}&quot;&gt;&lt;/label&gt;&lt;div class=&quot;px-actions&quot; style=&quot;margin-top:20px&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;check-bot&quot; ${connectionTestBusy ? &quot;disabled&quot; : &quot;&quot;}&gt;${connectionTestBusy ? &quot;\u6B63\u5728\u6A21\u62DF\u68C0\u67E5\u2026&quot; : &quot;\u6A21\u62DF\u68C0\u67E5\u8FDE\u63A5&quot;}&lt;/button&gt;&lt;span role=&quot;status&quot; class=&quot;px-muted&quot;&gt;${w.checked ? &quot;\u6A21\u62DF\u68C0\u67E5\u901A\u8FC7\uFF0C\u53EF\u4EE5\u7EE7\u7EED&quot; : &quot;\u5B8C\u6210\u68C0\u67E5\u540E\u7EE7\u7EED&quot;}&lt;/span&gt;&lt;/div&gt;`;
